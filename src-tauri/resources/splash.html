<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MizanNet Yükleniyor...</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      user-select: none;
      -webkit-user-select: none;
    }

    #splash-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      opacity: 1;
      transition: opacity 0.6s ease-in-out;
    }

    #splash-container.fade-out {
      opacity: 0;
    }

    #splash-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>
  <div id="splash-container">
    <video
      id="splash-video"
      src="splash.mp4"
      autoplay
      muted
      playsinline
      preload="auto"
    ></video>
  </div>

  <script>
    const { invoke } = window.__TAURI__.core;
    const video = document.getElementById('splash-video');
    const container = document.getElementById('splash-container');

    async function closeSplash() {
      container.classList.add('fade-out');
      await new Promise(r => setTimeout(r, 600));
      await invoke('close_splash_screen');
    }

    // Video bitince kapat
    video.addEventListener('ended', closeSplash);

    // Hata durumunda da kapat (video yüklenemezse)
    video.addEventListener('error', () => {
      setTimeout(closeSplash, 500);
    });

    // Güvenlik: video 10 saniyeden uzunsa da kapat
    setTimeout(closeSplash, 10000);
  </script>
</body>
</html>
